services:
  aru-voice-call:
    build: .
    container_name: aru-voice-call
    restart: unless-stopped
    ports:
      - "${PORT:-8443}:${PORT:-8443}"
    env_file:
      - .env
    volumes:
      - ./certs:/certs:ro

