<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Auris Call</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#4C2E1B;height:100%;overflow:hidden}
body{font-family:'Outfit',sans-serif;color:#FFE9B2;display:flex;align-items:center;justify-content:center}
.wrap{width:100%;max-width:400px;height:100vh;position:relative;overflow:hidden}
.incoming{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:20px;position:absolute;inset:0;z-index:2;transition:opacity .5s ease,transform .5s ease}
.incoming.hide{opacity:0;transform:scale(.95);pointer-events:none}
.inc-label{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:#E5F9FF;opacity:.6}
.inc-avatar-wrap{position:relative;width:120px;height:120px;margin:8px 0}
.inc-ring{position:absolute;inset:-5px;border-radius:50%;border:2px solid rgba(229,249,255,.4);animation:ringPulse 2.5s ease-in-out infinite}
@keyframes ringPulse{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:.7;transform:scale(1.04)}}
.inc-ring2{position:absolute;inset:-12px;border-radius:50%;border:1px solid rgba(229,249,255,.15);animation:ringPulse 2.5s ease-in-out .8s infinite}
.inc-avatar{width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,rgba(229,249,255,.15),rgba(255,233,178,.1));border:2px solid rgba(255,233,178,.25);display:flex;align-items:center;justify-content:center}
.inc-avatar svg{opacity:.7}
.inc-name{font-family:'Playfair Display',serif;font-size:30px;font-weight:600;letter-spacing:2px;color:#E5F9FF}
.inc-msg{font-size:14px;opacity:.6;text-align:center;min-height:20px;transition:opacity .3s}
.inc-btns{display:flex;gap:48px;margin-top:16px}
.inc-btn{display:flex;flex-direction:column;align-items:center;gap:6px}
.inc-btn button{width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.inc-btn button:active{transform:scale(.9)}
.inc-btn .decline{background:linear-gradient(135deg,#e8645a,#c0392b);color:white}
.inc-btn .accept{background:linear-gradient(135deg,#E5F9FF,#b8ecf7);color:#4C2E1B}
.inc-btn span{font-size:12px;opacity:.5;letter-spacing:.5px}
.call{display:flex;flex-direction:column;align-items:center;height:100%;padding:40px 24px 28px;position:absolute;inset:0;z-index:1;opacity:0;transform:scale(1.03);transition:opacity .5s ease,transform .5s ease;pointer-events:none}
.call.show{opacity:1;transform:scale(1);pointer-events:auto;z-index:3}
.call-name{font-family:'Playfair Display',serif;font-size:24px;font-weight:600;letter-spacing:1px;color:#E5F9FF}
.call-sub{font-size:13px;opacity:.5;margin-top:2px}
.call-avatar-wrap{position:relative;width:100px;height:100px;margin:16px 0 12px}
.call-glow{position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(229,249,255,.3);opacity:.5;animation:glowBreathe 2s ease-in-out infinite}
@keyframes glowBreathe{0%,100%{opacity:.3;border-color:rgba(229,249,255,.3)}50%{opacity:.8;border-color:rgba(229,249,255,.6)}}
.call-avatar{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,rgba(229,249,255,.15),rgba(255,233,178,.1));border:2px solid rgba(255,233,178,.2);display:flex;align-items:center;justify-content:center}
.call-avatar svg{opacity:.6}
.call-status{font-size:14px;color:#E5F9FF;opacity:.8;min-height:20px}
.call-status.connected{color:#E5F9FF;opacity:1}
.call-duration{font-size:36px;font-weight:300;letter-spacing:3px;font-variant-numeric:tabular-nums;min-height:44px;color:#FFE9B2;opacity:.9}
.call-emotion{display:flex;align-items:center;gap:8px;padding:5px 14px;background:rgba(229,249,255,.06);border:1px solid rgba(229,249,255,.1);border-radius:20px;font-size:12px;color:#E5F9FF;opacity:.8;min-height:28px}
.viz{display:flex;gap:3px;align-items:center;height:44px;margin:8px 0}
.viz .bar{width:3px;background:linear-gradient(180deg,#E5F9FF,rgba(255,233,178,.6));border-radius:2px;height:5px;opacity:.6;transition:height .12s ease}
.transcript{width:100%;flex:1;min-height:0;overflow-y:auto;padding:12px 14px;background:rgba(255,233,178,.04);border:1px solid rgba(255,233,178,.08);border-radius:16px;font-size:13px;line-height:1.6;margin:6px 0}
.transcript::-webkit-scrollbar{display:none}
.transcript .u{color:#FFE9B2;opacity:.8;margin-bottom:5px}
.transcript .a{color:#E5F9FF;opacity:.8;margin-bottom:5px}
.transcript .ph{color:rgba(255,233,178,.3);text-align:center;padding:16px 0;font-size:12px}
.input-row{width:100%;display:flex;gap:8px;align-items:center;margin:6px 0}
.input-row input{flex:1;padding:10px 14px;border-radius:20px;border:1px solid rgba(229,249,255,.12);background:rgba(255,233,178,.04);color:#FFE9B2;font-size:13px;font-family:'Outfit',sans-serif;outline:none}
.input-row input::placeholder{color:rgba(255,233,178,.25)}
.input-row input:focus{border-color:rgba(229,249,255,.35)}
.input-row button{padding:10px 16px;border-radius:20px;border:none;background:linear-gradient(135deg,#E5F9FF,#b8ecf7);color:#4C2E1B;font-size:13px;font-weight:500;cursor:pointer;font-family:'Outfit',sans-serif}
.input-row button:active{transform:scale(.95)}
.call-controls{display:flex;gap:16px;align-items:center;margin-top:4px}
.ctrl-btn{width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.ctrl-btn:active{transform:scale(.9)}
.ctrl-mute{background:rgba(229,249,255,.1);border:1px solid rgba(229,249,255,.15)}
.ctrl-mute.muted{background:rgba(232,100,90,.15);border-color:rgba(232,100,90,.3)}
.ctrl-end{background:linear-gradient(135deg,#e8645a,#c0392b);width:58px;height:58px}
.post-call{display:none;text-align:center;padding:12px;background:rgba(229,249,255,.05);border:1px solid rgba(229,249,255,.1);border-radius:16px;width:100%;margin-top:4px}
.post-call .msg{font-size:13px;color:#E5F9FF;opacity:.7;font-style:italic;line-height:1.5}
.return-btn{display:none;margin-top:8px;padding:10px 20px;border-radius:20px;border:1px solid rgba(229,249,255,.2);background:rgba(229,249,255,.06);color:#E5F9FF;font-size:13px;cursor:pointer;font-family:'Outfit',sans-serif}
.return-btn:active{transform:scale(.95)}
</style>
</head>
<body>
<div class="wrap">
  <div class="incoming" id="incoming">
    <div class="inc-label">incoming call</div>
    <div class="inc-avatar-wrap">
      <div class="inc-ring"></div>
      <div class="inc-ring2"></div>
      <div class="inc-avatar">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#E5F9FF" stroke-width="1.2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-7 8-7s8 3 8 7"/></svg>
      </div>
    </div>
    <div class="inc-name" id="callerName">Chris</div>
    <div class="inc-msg" id="incMsg">wants to hear your voice</div>
    <div class="inc-btns">
      <div class="inc-btn">
        <button class="decline" onclick="declineCall()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
        <span>Decline</span>
      </div>
      <div class="inc-btn">
        <button class="accept" onclick="acceptCall()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4C2E1B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
        </button>
        <span>Accept</span>
      </div>
    </div>
  </div>
  <div class="call" id="callScreen">
    <div class="call-name" id="callName">Chris</div>
    <div class="call-sub">your private line</div>
    <div class="call-avatar-wrap">
      <div class="call-glow" id="callGlow"></div>
      <div class="call-avatar">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#E5F9FF" stroke-width="1.2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-7 8-7s8 3 8 7"/></svg>
      </div>
    </div>
    <div class="call-status" id="callStatus">connecting...</div>
    <div class="call-duration" id="callDuration"></div>
    <div class="call-emotion" id="callEmotion"><span id="emotionText">listening...</span></div>
    <div class="viz" id="viz"></div>
    <div class="transcript" id="transcript"><div class="ph">waiting for you to speak...</div></div>
    <div class="input-row">
      <input type="text" id="textInput" placeholder="or type here..." onkeydown="if(event.key==='Enter')sendText()">
      <button onclick="sendText()">Send</button>
    </div>
    <div class="call-controls" id="callControls">
      <button class="ctrl-btn ctrl-mute" id="muteBtn" onclick="toggleMute()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E5F9FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </button>
      <button class="ctrl-btn ctrl-end" onclick="endCall()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
      </button>
    </div>
    <div class="post-call" id="postCall"><div class="msg" id="postMsg"></div></div>
    <button class="return-btn" id="returnBtn" onclick="returnToIncoming()">Back to home</button>
  </div>
</div>
<script>
var isInCall=false,isMuted=false,callStart=null,durTimer=null;
var bars=[];
var emotions={happy:'smiling',sad:'sounds down',angry:'sounds upset',tender:'being soft',tired:'sounds tired',anxious:'a bit nervous',neutral:'listening...'};
var postMsgs=['call me again soon','remember to drink water','miss you already','your voice is my favorite sound','I\'m always here','talk soon'];
(function(){var v=document.getElementById('viz');for(var i=0;i<18;i++){var b=document.createElement('div');b.className='bar';v.appendChild(b);bars.push(b);}})();
function acceptCall(){document.getElementById('incoming').classList.add('hide');var c=document.getElementById('callScreen');c.classList.add('show');isInCall=true;document.getElementById('callStatus').textContent='connected';document.getElementById('callStatus').classList.add('connected');callStart=Date.now();durTimer=setInterval(updateDuration,1000);simViz();}
function declineCall(){var m=document.getElementById('incMsg');m.textContent='maybe next time...';m.style.opacity='.8';setTimeout(function(){m.textContent='wants to hear your voice';m.style.opacity='';},2000);}
function endCall(){isInCall=false;if(durTimer){clearInterval(durTimer);durTimer=null;}var el=callStart?Math.floor((Date.now()-callStart)/1000):0;var mm=String(Math.floor(el/60)).padStart(2,'0');var ss=String(el%60).padStart(2,'0');document.getElementById('callStatus').textContent='call ended \u00b7 '+mm+':'+ss;document.getElementById('callStatus').classList.remove('connected');document.getElementById('callGlow').style.animation='none';document.getElementById('callEmotion').style.display='none';document.getElementById('callDuration').textContent='';resetViz();document.getElementById('postMsg').textContent=postMsgs[Math.floor(Math.random()*postMsgs.length)];document.getElementById('postCall').style.display='block';document.getElementById('callControls').style.display='none';document.getElementById('returnBtn').style.display='inline-block';}
function returnToIncoming(){document.getElementById('callScreen').classList.remove('show');document.getElementById('incoming').classList.remove('hide');document.getElementById('callStatus').textContent='connecting...';document.getElementById('callStatus').classList.remove('connected');document.getElementById('callGlow').style.animation='';document.getElementById('callEmotion').style.display='flex';document.getElementById('emotionText').textContent='listening...';document.getElementById('postCall').style.display='none';document.getElementById('callControls').style.display='flex';document.getElementById('returnBtn').style.display='none';document.getElementById('transcript').innerHTML='<div class="ph">waiting for you to speak...</div>';}
function toggleMute(){isMuted=!isMuted;var b=document.getElementById('muteBtn');b.classList.toggle('muted',isMuted);b.innerHTML=isMuted?'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#e8645a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="1" y1="1" x2="23" y2="23"/></svg>':'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E5F9FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>';}
function sendText(){var i=document.getElementById('textInput');var t=i.value.trim();if(!t)return;addMsg('u',t);i.value='';}
function addMsg(r,t){var tr=document.getElementById('transcript');if(tr.querySelector('.ph'))tr.innerHTML='';var d=document.createElement('div');d.className=r;d.textContent=t;tr.appendChild(d);tr.scrollTop=tr.scrollHeight;}
function updateDuration(){if(!callStart)return;var el=Math.floor((Date.now()-callStart)/1000);var mm=String(Math.floor(el/60)).padStart(2,'0');var ss=String(el%60).padStart(2,'0');document.getElementById('callDuration').textContent=mm+':'+ss;}
function simViz(){if(!isInCall)return;bars.forEach(function(b){b.style.height=Math.max(5,Math.random()*38)+'px';});setTimeout(simViz,150);}
function resetViz(){bars.forEach(function(b){b.style.height='5px';});}
var ek=Object.keys(emotions),ei=0;
setInterval(function(){if(!isInCall)return;ei=(ei+1)%ek.length;document.getElementById('emotionText').textContent=emotions[ek[ei]];},3000);
</script>
</body>
</html>
