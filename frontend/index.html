<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Voice Call</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .call-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            box-shadow: 0 0 0 0 rgba(102, 126, 234, 0.4);
            transition: box-shadow 0.3s;
        }

        .avatar.active {
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(102, 126, 234, 0.4); }
            50% { box-shadow: 0 0 0 20px rgba(102, 126, 234, 0); }
        }

        .status {
            font-size: 16px;
            color: #888;
            text-align: center;
            min-height: 24px;
        }

        .status.connected {
            color: #4ade80;
        }

        .transcript-area {
            width: 100%;
            min-height: 100px;
            max-height: 200px;
            overflow-y: auto;
            padding: 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
        }

        .transcript-area .user {
            color: #93c5fd;
            margin-bottom: 8px;
        }

        .transcript-area .assistant {
            color: #c4b5fd;
            margin-bottom: 8px;
        }

        .transcript-area .emotion-tag {
            font-size: 12px;
            color: #666;
            margin-left: 8px;
        }

        .controls {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .call-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            transition: transform 0.2s, background 0.2s;
        }

        .call-btn:active {
            transform: scale(0.9);
        }

        .call-btn.start {
            background: #4ade80;
            color: #000;
        }

        .call-btn.end {
            background: #ef4444;
            color: #fff;
        }

        .call-btn.mute {
            width: 56px;
            height: 56px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 20px;
        }

        .call-btn.mute.muted {
            background: rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }

        .visualizer {
            display: flex;
            gap: 3px;
            align-items: center;
            height: 40px;
        }

        .visualizer .bar {
            width: 4px;
            background: #667eea;
            border-radius: 2px;
            transition: height 0.1s;
            height: 4px;
        }

        .duration {
            font-size: 14px;
            color: #666;
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>
    <div class="call-container">
        <div class="avatar" id="avatar">💕</div>
        <div class="status" id="status">点击拨打</div>
        <div class="duration" id="duration"></div>

        <div class="visualizer" id="visualizer">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>

        <div class="transcript-area" id="transcripts"></div>

        <div class="controls">
            <button class="call-btn mute" id="muteBtn" style="display:none" onclick="toggleMute()">🎙️</button>
            <button class="call-btn start" id="callBtn" onclick="toggleCall()">📞</button>
        </div>
    </div>

    <script>
        let ws = null;
        let mediaStream = null;
        let audioContext = null;
        let processor = null;
        let isInCall = false;
        let isMuted = false;
        let callStartTime = null;
        let durationTimer = null;
        let playbackContext = null;
        let audioQueue = [];
        let isPlaying = false;

        const avatar = document.getElementById('avatar');
        const status = document.getElementById('status');
        const callBtn = document.getElementById('callBtn');
        const muteBtn = document.getElementById('muteBtn');
        const transcripts = document.getElementById('transcripts');
        const duration = document.getElementById('duration');
        const visualizer = document.getElementById('visualizer');
        const bars = visualizer.querySelectorAll('.bar');

        function generateSessionId() {
            return Math.random().toString(36).substring(2, 10);
        }

        async function toggleCall() {
            if (isInCall) {
                endCall();
            } else {
                await startCall();
            }
        }

        async function startCall() {
            try {
                status.textContent = '连接中...';

                // Get microphone
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        sampleRate: 16000,
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true,
                    }
                });

                // Setup audio processing
                audioContext = new AudioContext({ sampleRate: 16000 });
                const source = audioContext.createMediaStreamSource(mediaStream);
                processor = audioContext.createScriptProcessor(4096, 1, 1);

                processor.onaudioprocess = (e) => {
                    if (!isInCall || isMuted) return;
                    const inputData = e.inputBuffer.getChannelData(0);
                    const pcm16 = new Int16Array(inputData.length);
                    for (let i = 0; i < inputData.length; i++) {
                        pcm16[i] = Math.max(-32768, Math.min(32767, inputData[i] * 32768));
                    }
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(pcm16.buffer);
                    }
                    updateVisualizer(inputData);
                };

                source.connect(processor);
                processor.connect(audioContext.destination);

                // Setup playback context
                playbackContext = new AudioContext({ sampleRate: 24000 });

                // Connect WebSocket
                const sessionId = generateSessionId();
                const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
                ws = new WebSocket(`${protocol}//${location.host}/ws/call/${sessionId}`);
                ws.binaryType = 'arraybuffer';

                ws.onopen = () => {
                    isInCall = true;
                    status.textContent = '通话中';
                    status.className = 'status connected';
                    callBtn.className = 'call-btn end';
                    callBtn.textContent = '☎️';
                    muteBtn.style.display = 'flex';
                    avatar.classList.add('active');
                    callStartTime = Date.now();
                    durationTimer = setInterval(updateDuration, 1000);
                };

                ws.onmessage = (event) => {
                    if (event.data instanceof ArrayBuffer) {
                        // Audio data from TTS
                        audioQueue.push(event.data);
                        if (!isPlaying) playAudioQueue();
                    } else {
                        const msg = JSON.parse(event.data);
                        handleMessage(msg);
                    }
                };

                ws.onclose = () => {
                    if (isInCall) endCall();
                };

                ws.onerror = (e) => {
                    console.error('WebSocket error:', e);
                    status.textContent = '连接失败';
                    status.className = 'status';
                };

            } catch (err) {
                console.error('Failed to start call:', err);
                status.textContent = '需要麦克风权限';
                status.className = 'status';
            }
        }

        function endCall() {
            isInCall = false;

            if (ws) {
                ws.send(JSON.stringify({ type: 'end_call' }));
                ws.close();
                ws = null;
            }

            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
                mediaStream = null;
            }

            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }

            if (playbackContext) {
                playbackContext.close();
                playbackContext = null;
            }

            if (durationTimer) {
                clearInterval(durationTimer);
                durationTimer = null;
            }

            audioQueue = [];
            isPlaying = false;

            status.textContent = '通话结束';
            status.className = 'status';
            callBtn.className = 'call-btn start';
            callBtn.textContent = '📞';
            muteBtn.style.display = 'none';
            avatar.classList.remove('active');
            duration.textContent = '';
            resetVisualizer();
        }

        function toggleMute() {
            isMuted = !isMuted;
            muteBtn.className = isMuted ? 'call-btn mute muted' : 'call-btn mute';
            muteBtn.textContent = isMuted ? '🔇' : '🎙️';
        }

        function handleMessage(msg) {
            if (msg.type === 'transcript') {
                const tag = msg.emotion?.emotion !== 'neutral'
                    ? `<span class="emotion-tag">[${msg.emotion.emotion}]</span>` : '';
                if (msg.is_final) {
                    addTranscript('user', msg.text + tag);
                }
            } else if (msg.type === 'response') {
                addTranscript('assistant', msg.text);
            } else if (msg.type === 'audio_end') {
                // TTS finished
            } else if (msg.type === 'error') {
                console.error('Server error:', msg.message);
            }
        }

        function addTranscript(role, html) {
            const div = document.createElement('div');
            div.className = role;
            div.innerHTML = (role === 'user' ? '👤 ' : '🤖 ') + html;
            transcripts.appendChild(div);
            transcripts.scrollTop = transcripts.scrollHeight;
        }

        async function playAudioQueue() {
            if (!playbackContext || audioQueue.length === 0) {
                isPlaying = false;
                return;
            }
            isPlaying = true;

            const data = audioQueue.shift();
            const pcm16 = new Int16Array(data);
            const float32 = new Float32Array(pcm16.length);
            for (let i = 0; i < pcm16.length; i++) {
                float32[i] = pcm16[i] / 32768.0;
            }

            const buffer = playbackContext.createBuffer(1, float32.length, 24000);
            buffer.getChannelData(0).set(float32);

            const source = playbackContext.createBufferSource();
            source.buffer = buffer;
            source.connect(playbackContext.destination);
            source.onended = () => playAudioQueue();
            source.start();
        }

        function updateVisualizer(audioData) {
            const step = Math.floor(audioData.length / bars.length);
            for (let i = 0; i < bars.length; i++) {
                let sum = 0;
                for (let j = 0; j < step; j++) {
                    sum += Math.abs(audioData[i * step + j]);
                }
                const avg = sum / step;
                const height = Math.max(4, Math.min(40, avg * 500));
                bars[i].style.height = height + 'px';
            }
        }

        function resetVisualizer() {
            bars.forEach(b => b.style.height = '4px');
        }

        function updateDuration() {
            if (!callStartTime) return;
            const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
            const min = Math.floor(elapsed / 60).toString().padStart(2, '0');
            const sec = (elapsed % 60).toString().padStart(2, '0');
            duration.textContent = `${min}:${sec}`;
        }
    </script>
</body>
</html>
