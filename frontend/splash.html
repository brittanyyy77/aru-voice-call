<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Auris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Pinyon+Script&family=Outfit:wght@300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#4C2E1B;height:100%;overflow:hidden}
body{
  font-family:'Outfit',sans-serif;color:#FFE9B2;
  display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;
}
body::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 40% 35%,rgba(255,233,178,.06) 0%,transparent 50%),
             radial-gradient(circle at 60% 65%,rgba(229,249,255,.04) 0%,transparent 50%);
  pointer-events:none;
}
.sp{display:flex;flex-direction:column;align-items:center;gap:28px;position:relative;z-index:1}
.cw{position:relative;width:300px;height:180px}
canvas{width:300px;height:180px;display:block}
.gl{position:absolute;width:80px;height:80px;top:32%;left:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(255,233,178,.45) 0%,rgba(229,249,255,.12) 40%,transparent 70%);
  border-radius:50%;opacity:0;filter:blur(4px);pointer-events:none;transition:opacity 1.2s ease}
.gl.on{opacity:.75}
.pl{position:absolute;width:100px;height:100px;top:32%;left:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(255,233,178,.12) 0%,transparent 70%);
  border-radius:50%;opacity:0;pointer-events:none}
.pl.on{animation:pg 3s ease-in-out infinite}
@keyframes pg{0%,100%{opacity:.2;transform:translate(-50%,-50%) scale(1)}50%{opacity:.5;transform:translate(-50%,-50%) scale(1.35)}}
.an{font-family:'Playfair Display',serif;font-size:52px;font-weight:600;letter-spacing:6px;
  color:#FFE9B2;opacity:0;transform:translateY(25px);
  transition:opacity 1.4s cubic-bezier(.25,.46,.45,.94),transform 1.4s cubic-bezier(.25,.46,.45,.94);
  text-shadow:0 2px 20px rgba(255,233,178,.2)}
.an.on{opacity:1;transform:translateY(0)}
.cr{display:flex;align-items:center;gap:20px;margin-top:4px;opacity:0;transform:translateY(15px);
  transition:opacity 1s cubic-bezier(.25,.46,.45,.94),transform 1s cubic-bezier(.25,.46,.45,.94)}
.cr.on{opacity:1;transform:translateY(0)}
.cp{display:flex;flex-direction:column;align-items:center;gap:2px}
.cn{font-family:'Outfit',sans-serif;font-weight:300;font-size:13px;color:#FFE9B2;opacity:.7;letter-spacing:1px}
.cs{font-family:'Pinyon Script',cursive;font-size:14px;color:#FFE9B2;opacity:.5}
.cb{font-family:'Pinyon Script',cursive;font-size:36px;color:#FFE9B2;opacity:.6;line-height:1;
  text-shadow:0 0 20px rgba(255,233,178,.15)}
</style>
</head>
<body>
<div class="sp">
  <div class="cw">
    <canvas id="c" width="600" height="360"></canvas>
    <div class="gl" id="gl"></div>
    <div class="pl" id="pl"></div>
  </div>
  <div class="an" id="an">Auris</div>
  <div class="cr" id="cr">
    <div class="cp"><span class="cn">Brittany</span><span class="cs">&</span><span class="cn">Chris</span></div>
    <span class="cb">&</span>
    <div class="cp"><span class="cn">Miso.yan_</span><span class="cs">&</span><span class="cn">Kian</span></div>
  </div>
</div>
<script>
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height,mx=W/2,my=H/2-10;
function rawPath(yOff,amp,side,ph){
  var r=[],n=2000;
  for(var i=0;i<=n;i++){
    var t=i/n,px,py;
    if(t<0.28){
      var u=t/0.28;
      px=20+u*(mx-90-20);
      py=my+yOff+Math.sin((u*3.5+ph)*Math.PI)*amp*(0.3+u*0.7);
    }else if(t<0.72){
      var u=(t-0.28)/0.44,a,hr=50;
      if(side===0){a=-Math.PI+u*Math.PI}else{a=u*Math.PI}
      px=mx+hr*16*Math.pow(Math.sin(a),3)/16;
      py=my-18-hr*(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))/16;
    }else{
      var u=(t-0.72)/0.28;
      px=mx+90+u*(W-20-mx-90);
      py=my+yOff+Math.sin((u*3.5+ph+2)*Math.PI)*amp*(1-u*0.7);
    }
    r.push({x:px,y:py});
  }
  return r;
}
function resample(raw,count){
  var dists=[0];
  for(var i=1;i<raw.length;i++){
    var dx=raw[i].x-raw[i-1].x,dy=raw[i].y-raw[i-1].y;
    dists.push(dists[i-1]+Math.sqrt(dx*dx+dy*dy));
  }
  var totalLen=dists[dists.length-1],step=totalLen/count,result=[raw[0]],ci=1;
  for(var i=1;i<count;i++){
    var target=i*step;
    while(ci<dists.length-1&&dists[ci]<target)ci++;
    var seg=dists[ci]-dists[ci-1],frac=seg>0?(target-dists[ci-1])/seg:0;
    result.push({x:raw[ci-1].x+(raw[ci].x-raw[ci-1].x)*frac,y:raw[ci-1].y+(raw[ci].y-raw[ci-1].y)*frac});
  }
  result.push(raw[raw.length-1]);
  return result;
}
var NUM=500,wP=resample(rawPath(-8,20,0,0),NUM),cP=resample(rawPath(8,20,1,0.6),NUM);
var dur=3500,st=null,done=false;
function ez(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function dl(p,c,col,al){
  if(c<2)return;
  ctx.beginPath();ctx.strokeStyle=col;ctx.globalAlpha=al;
  ctx.lineWidth=4.5;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.moveTo(p[0].x,p[0].y);
  for(var i=1;i<c;i++){var a=p[i-1],b=p[i];ctx.quadraticCurveTo(a.x,a.y,(a.x+b.x)/2,(a.y+b.y)/2);}
  ctx.stroke();ctx.globalAlpha=1;
}
function fr(ts){
  if(!st)st=ts;
  var el=ts-st,pg=Math.min(1,el/dur);
  var e1=ez(pg),e2=ez(Math.max(0,(el-200)/dur));
  ctx.clearRect(0,0,W,H);
  dl(wP,Math.floor(e1*wP.length),'#FFE9B2',.88);
  dl(cP,Math.floor(e2*cP.length),'#E5F9FF',.65);
  if(pg>.3)document.getElementById('gl').classList.add('on');
  if(pg>.55)document.getElementById('an').classList.add('on');
  if(pg>.7)document.getElementById('cr').classList.add('on');
  if(pg>=1&&!done){done=true;document.getElementById('pl').classList.add('on');}
  if(!done)requestAnimationFrame(fr);
  else setTimeout(function(){window.location.href='onboarding.html';},1500);
}
requestAnimationFrame(fr);
</script>
</body>
</html>
